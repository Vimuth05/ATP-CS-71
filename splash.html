<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diner. | Dine out with less waiting</title>
<meta name="description" content="Diner. lets guests find a table, join the live queue, order from the table QR and split the bill.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130b09;
  --card:#22150f;
  --text:#F6ECE4;
  --muted:#A99A92;
  --orange:#FF6A00;
  --deep:#C94E00;
  --purple:#7C3AED;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:grid;place-items:center;overflow:hidden;
}
.photo{
  position:fixed;inset:0;z-index:0;
  background:url(assets/cinematic-hero.webp) center/cover no-repeat;
  -webkit-mask-image:linear-gradient(100deg,transparent 20%,rgba(0,0,0,.5) 55%,#000 95%);
  mask-image:linear-gradient(100deg,transparent 20%,rgba(0,0,0,.5) 55%,#000 95%);
  opacity:.55;animation:drift 20s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(19,11,9,.55),rgba(19,11,9,.2) 40%,rgba(19,11,9,.95))}
main{
  position:relative;z-index:2;width:min(640px,calc(100% - 40px));
  display:flex;flex-direction:column;align-items:flex-start;gap:20px;
}
.line{width:100%;height:1px;background:color-mix(in srgb,var(--text) 18%,transparent);transform:scaleX(0);transform-origin:left;animation:grow 1.2s var(--ease) .2s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.brand{display:flex;align-items:center;gap:14px;opacity:0;animation:up .9s var(--ease) .35s forwards}
.brand img{width:52px;height:52px;border-radius:14px;display:block}
.brand span{font-size:30px;font-weight:700;letter-spacing:-.02em}
.brand span i{font-style:normal;color:var(--orange)}
h1{
  margin:0;font-size:clamp(44px,9vw,84px);font-weight:700;line-height:1;letter-spacing:-.035em;
  opacity:0;animation:up 1s var(--ease) .6s forwards;
}
h1 em{font-style:normal;color:var(--orange)}
.tag{margin:0;font-size:17px;color:var(--muted);max-width:44ch;line-height:1.6;opacity:0;animation:up .9s var(--ease) .9s forwards}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:16px;margin-top:12px;opacity:0;animation:up .9s var(--ease) 1.1s forwards}
.steps{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.steps span{white-space:nowrap}
.steps b{color:var(--text);font-weight:500}
.enter{
  display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:28px;
  background:var(--orange);color:#fff;text-decoration:none;font-weight:700;font-size:15px;
  transition:transform .4s var(--ease),background-color .3s var(--ease),box-shadow .3s var(--ease);
}
.enter:hover,.enter:focus-visible{background:var(--deep);transform:translateY(-2px);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--orange) 70%,transparent);outline:none}
.enter svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scan{position:fixed;right:24px;bottom:20px;z-index:2;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);opacity:0;animation:up .9s var(--ease) 1.3s forwards}
.scan img{width:64px;height:64px;padding:5px;background:#fff;border-radius:10px;display:block}
.note{position:fixed;left:24px;bottom:20px;z-index:2;font-size:12px;color:var(--muted);opacity:0;animation:up .9s var(--ease) 1.3s forwards}
.purple{color:var(--purple)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(max-width:640px){
  .row{flex-direction:column;align-items:stretch}
  .enter{justify-content:center;width:100%}
  .steps{justify-content:center}
  .scan{display:none}
  .note{left:16px;right:16px;text-align:center;bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .brand,h1,.tag,.row,.note,.line{opacity:1;transform:none}
  .line{transform:none}
}
</style>
</head>
<body>
<div class="photo" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<main>
  <div class="line" aria-hidden="true"></div>
  <div class="brand">
    <img src="assets/diner-logo.png" alt="">
    <span>Diner<i>.</i></span>
  </div>
  <h1>Dine out with <em>less waiting.</em></h1>
  <p class="tag">Find a table, join the live queue, order from the QR on your table and split the bill, all from one phone.</p>
  <div class="row">
    <div class="steps" aria-label="How Diner works">
      <span><b>Discover</b></span>
      <span><b>Reserve</b> or queue</span>
      <span><b>Order</b> and pay</span>
      <span><b>Dine</b> together</span>
    </div>
    <a class="enter" href="index.html">Enter Diner
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</main>
<div class="scan" aria-hidden="true"><span>Scan to<br>order</span><img src="assets/splash-qr.png" alt=""></div>
<p class="note">Concept website for an Agile Team Project. Demo content only.</p>
<script>
  // Continue to the main page automatically after a short moment
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t = setTimeout(function(){ window.location.href = 'index.html'; }, reduce ? 6000 : 4200);
  document.addEventListener('pointerdown', function(){ clearTimeout(t); });
  document.addEventListener('keydown', function(){ clearTimeout(t); });
</script>
</body>
</html>
